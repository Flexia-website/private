{% extends "base.html" %}
{% block title %}Connect | PRIVATE CHAT{% endblock %}
{% block body_class %}app-bg{% endblock %}
{% block content %}
<div class="app-shell">
  <header class="app-header">
    <a href="{{ url_for('user.home') }}" class="back"><i class="fa-solid fa-arrow-left"></i></a>
    <span>Connect to Public Figure</span>
  </header>
  <main class="app-main">
    <div class="glass card-center">
      <h2>Connect to Public Figure</h2>
      <p class="muted">Enter the registered phone number</p>
      <div class="form">
        <div class="row">
          <select id="country" class="input">
            <option value="+234">NG +234</option>
            <option value="+1">US +1</option>
            <option value="+44">UK +44</option>
            <option value="+91">IN +91</option>
            <option value="+27">ZA +27</option>
            <option value="+233">GH +233</option>
            <option value="+254">KE +254</option>
          </select>
          <input id="phone" class="input" placeholder="XXX XXX XXXX">
        </div>
        <button id="continueBtn" class="btn btn-primary glow">Continue</button>
      </div>
      <div id="result" class="result"></div>
    </div>
  </main>
</div>
{% endblock %}
{% block scripts %}
<script>
const btn = document.getElementById('continueBtn');
btn.onclick = async () => {
  const c = document.getElementById('country').value;
  const p = document.getElementById('phone').value.trim();
  if (!p) return;
  const phone = p.startsWith('+') ? p : c + p.replace(/\D/g, '');
  btn.disabled = true; btn.innerHTML = 'Checking...';
  const res = await fetch('{{ url_for("user.connect") }}', {
    method: 'POST',
    headers: {'Content-Type':'application/x-www-form-urlencoded'},
    body: 'phone=' + encodeURIComponent(phone)
  });
  const data = await res.json();
  btn.disabled = false; btn.innerHTML = 'Continue';
  if (!data.ok) { document.getElementById('result').innerHTML = '<div class="error">' + data.error + '</div>'; return; }
  const pf = data.public_figure;
  document.getElementById('result').innerHTML =
    '<div class="verified-anim">' +
      '<div class="glow-circle-lg"><i class="fa-solid fa-check"></i></div>' +
      '<h3>VERIFICATION SUCCESSFUL</h3>' +
      '<p>You are now connected to ' + pf.name + '.</p>' +
      '<div class="pf-avatar-lg">' +
        (pf.photo ? '<img src="' + pf.photo + '">' : '<div class="avatar avatar-fallback xl">' + pf.name[0] + '</div>') +
      '</div>' +
      (pf.verified ? '<div class="inline" style="display:inline-flex;align-items:center;gap:4px;"><svg class="verified-badge" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="vbg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3fa9ff"/><stop offset="1" stop-color="#0a84ff"/></linearGradient></defs><path fill="url(#vbg)" d="M24 2.6l4.9 3.6 6-.8 2.6 5.5 5.5 2.6-.8 6 3.6 4.9-3.6 4.9.8 6-5.5 2.6-2.6 5.5-6-.8-4.9 3.6-4.9-3.6-6 .8-2.6-5.5-5.5-2.6.8-6L2.6 24l3.6-4.9-.8-6 5.5-2.6 2.6-5.5 6 .8L24 2.6z"/><path fill="#ffffff" d="M20.5 30.6l-5.1-5.1 2.1-2.1 3 3 8.1-8.1 2.1 2.1-10.2 10.2z"/></svg><span style="font-size:12px;color:#c4b5fd;">Verified</span></div>' : '') +
      '<button class="btn btn-primary glow" onclick="confirmConnect(' + pf.id + ')">START CHAT</button>' +
    '</div>';
};
async function confirmConnect(id) {
  const res = await fetch('{{ url_for("user.connect_confirm") }}', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({public_figure_id: id})
  });
  const data = await res.json();
  if (data.ok) window.location = data.redirect;
}
</script>
{% endblock %}
